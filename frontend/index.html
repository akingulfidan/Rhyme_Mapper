<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rhyme Mapper</title>
    <link rel="stylesheet" href="css/base.css" />
  </head>

  <body>
    <div id="inputContainer">
      <div id="tabs">
        <button
          class="TabButton"
          role="tab"
          aria-selected="true"
          data-tab="input"
        >
          Input
        </button>
        <button
          class="TabButton"
          role="tab"
          aria-selected="false"
          data-tab="filters"
        >
          Filters
        </button>
        <button
          class="TabButton"
          role="tab"
          aria-selected="false"
          data-tab="parameters"
        >
          Parameters
        </button>
        <button
          class="TabButton"
          role="tab"
          aria-selected="false"
          data-tab="export"
        >
          Export
        </button>
        <button
          class="TabButton"
          role="tab"
          aria-selected="false"
          data-tab="settings"
        >
          Settings
        </button>
      </div>

      <div id="input" class="TabContent">
        <select id="language"></select>
        <div id="editorContainer"></div>
        <button id="GenerateButton">Generate</button>
      </div>

      <div id="filters" class="TabContent" hidden>
        <div class="InputRow">
          <input type="checkbox" id="EnableMinLength" class="Checkbox" />
          <label for="MinLength"
            >Minimum Length: <span id="MinLengthFilterValue">0</span></label
          >
          <input
            type="range"
            id="MinLength"
            name="MinLength"
            min="0"
            max="0"
            value="0"
          />
        </div>
        <div class="InputRow">
          <input type="checkbox" id="EnableMaxLength" />
          <label for="MaxLength"
            >Maximum Length: <span id="MaxLengthFilterValue">0</span></label
          >
          <input
            type="range"
            id="MaxLength"
            name="MaxLength"
            min="0"
            max="0"
            value="0"
          />
        </div>
      </div>
      <div id="settings" class="TabContent" hidden>
        <div class="InputRow">
          <label for="theme">Theme:</label>
          <select id="theme">
            <option>System</option>
            <option>Light</option>
            <option>Dark</option>
          </select>
        </div>
      </div>
      <div id="parameters" class="TabContent" hidden>
        <div class="InputRow">
          <label for="graphMode">Graph Mode:</label>
          <select id="graphMode">
            <option value="linear">Linear</option>
            <option value="radial">Radial</option>
          </select>
        </div>
        <div class="InputRow">
          <label for="windowSize">Window Size:</label>
          <input type="number" id="windowSize" value="25" min="0" max="80" />
        </div>
      </div>
      <div id="export" class="TabContent" hidden>
        <div class="InputRow">
          <button id="exportSvg">Export SVG</button>
        </div>
        <div class="InputRow">
          <button id="exportPng">Export PNG</button>
        </div>
        <div class="InputRow">
          <button id="exportJpeg">Export JPEG</button>
        </div>
      </div>
    </div>
  </body>

  <script type="module" src="js/main.js"></script>
</html>
